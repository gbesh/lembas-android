name: Build Lembas APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download fonts (all SIL Open Font License)
        run: |
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fsSL -o "$1" "$2"; }
          mkdir -p fonts && cd fonts
          get Cinzel.ttf                    "$base/cinzel/Cinzel%5Bwght%5D.ttf"
          get CormorantGaramond.ttf         "$base/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf"
          get CormorantGaramond-Italic.ttf  "$base/cormorantgaramond/CormorantGaramond-Italic%5Bwght%5D.ttf"
          get IMFellEnglish-Regular.ttf     "$base/imfellenglish/IMFeENrm28P.ttf"
          get IMFellEnglish-Italic.ttf      "$base/imfellenglish/IMFeENit28P.ttf"
          get IMFellEnglishSC-Regular.ttf   "$base/imfellenglishsc/IMFeENsc28P.ttf"
          get Fraunces.ttf                  "$base/fraunces/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf"
          get Fraunces-Italic.ttf           "$base/fraunces/Fraunces-Italic%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf"
          get AlegreyaSans-Medium.ttf       "$base/alegreyasans/AlegreyaSans-Medium.ttf"
          cd ..
          # phone: assets/fonts with their family names
          mkdir -p app/src/main/assets/fonts && cp fonts/*.ttf app/src/main/assets/fonts/

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.LEMBAS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::warning::No signing key secret; this test build uses the debug key."; exit 0
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=No signing key::Add the LEMBAS_KEYSTORE_B64 secret so builds can update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lembas.keystore"

      - name: Build
        shell: bash
        env:
          LEMBAS_BUILD: ${{ github.run_number }}00
          LEMBAS_KEYSTORE: ${{ runner.temp }}/lembas.keystore
          LEMBAS_KEYSTORE_PASSWORD: ${{ secrets.LEMBAS_KEYSTORE_PASSWORD }}
          LEMBAS_KEY_PASSWORD: ${{ secrets.LEMBAS_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Surface the real error as an annotation so it is easy to read.
            grep -E "^e: " build.log | head -25 | sed 's/%/%25/g' | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | while read -r line; do echo "::error title=Kotlin::$line"; done
            # Gradle's own explanation, one annotation per line
            grep -A14 "What went wrong" build.log | grep -v "^\s*$" | head -20 | sed 's/%/%25/g' | while read -r line; do echo "::error title=Gradle::$line"; done
            grep -E "AAPT|error: resource|ERROR:" build.log | head -8 | sed 's/%/%25/g' | while read -r line; do echo "::error title=Resources::$line"; done
          fi
          exit $status

      - name: Collect the APK
        run: cp app/build/outputs/apk/release/app-release.apk lembas-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lembas
          path: |
            lembas-launcher.apk

      - name: Publish a release (the phone checks these to update itself)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=${{ github.run_number }}00
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          gh release create "v$code" lembas-launcher.apk --latest --title "Lembas 1.$code" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open lembas-launcher.apk on your phone to install; after that Lembas updates itself. The watch face and watch app are in gbesh/lembas-wear."
          # Keep the five newest releases.
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | while read -r t; do gh release delete "$t" -y --cleanup-tag; done

  # Test branches only: run Lembas on a phone emulator and capture each look, with the system theme
  screens:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: lembas
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Phone emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emulator-shots.sh

      - name: Publish the screenshots to the screens branch
        run: |
          cd shots
          git init -q && git checkout -q -b screens
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "screens ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens

  sizes:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_7_pro, pixel_tablet]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: lembas
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator screenshots on a bigger screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/size-shots.sh ${{ matrix.profile }}

      - name: Publish to the sizes-${{ matrix.profile }} branch
        run: |
          cd shots
          git init -q && git checkout -q -b sizes-${{ matrix.profile }}
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "sizes ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sizes-${{ matrix.profile }}

